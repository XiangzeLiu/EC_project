<div id="software-center-root">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-header-left"><div class="tile-icon ti-blue"><i class="ri-download-cloud-2-line"></i></div><h2 class="panel-title">软件中心</h2></div>
      <button class="btn-xs btn-pri" type="button" onclick="openSoftwareUpload()"><i class="ri-upload-2-line"></i> 上传软件</button>
    </div>
    <div class="software-toolbar"><button type="button" class="software-tab active" data-software-product="client" onclick="switchSoftwareProduct('client')">Client</button><button type="button" class="software-tab" data-software-product="ts" onclick="switchSoftwareProduct('ts')">TS</button></div>
    <div id="software-message" class="software-message" style="display:none"></div>
    <div id="software-release-list" class="software-release-list"><div class="empty-state">加载中...</div></div>
  </div>
  <div id="software-upload-panel" class="panel software-upload-panel" style="display:none;margin-top:16px">
    <div class="panel-header"><div class="panel-header-left"><div class="tile-icon ti-green"><i class="ri-upload-cloud-2-line"></i></div><h2 class="panel-title">上传软件</h2></div><button type="button" class="btn-xs btn-ghost" onclick="closeSoftwareUpload()">取消</button></div>
    <form id="software-upload-form" class="software-upload-form" onsubmit="submitSoftwareUpload(event)">
      <div class="software-form-grid"><label>软件类型<select id="software-upload-product" class="sel"><option value="client">Client</option><option value="ts">TS</option></select></label><label>版本号<input id="software-upload-version" class="inp" placeholder="例如 v_0_20260825093000" required /></label><label>软件包类型<select id="software-upload-artifact" class="sel" onchange="softwareArtifactTypeChanged()"><option value="installer">安装器</option><option value="archive">压缩包</option></select></label><label>文件<input id="software-upload-file" class="inp" type="file" accept=".exe,.msi" required /></label></div>
      <div class="software-upload-actions"><button class="btn-pri" type="submit"><i class="ri-upload-2-line"></i> 上传到草稿</button></div>
    </form>
  </div>
</div>
